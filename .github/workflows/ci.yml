name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummies: nothing here connects to a database. prisma generate and the build only need well-formed values.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generated client is gitignored, and the API typecheck imports it
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Not run here: smoke checks and migrations, which need a live database
